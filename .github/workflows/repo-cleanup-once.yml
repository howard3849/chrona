name: One-time Chrona repository cleanup

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Prepare one-time Chrona repository cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply repository cleanup
        run: python tools/repo_cleanup_once.py
