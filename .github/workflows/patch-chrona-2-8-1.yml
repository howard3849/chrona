name: Patch Chrona 2.8.1 interactions

on:
  push:
    branches: [dev]
    paths:
      - 'tools/patch_chrona_2_8_1.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/patch_chrona_2_8_1.py
      - name: Validate JavaScript
        run: node --check timeline.js
      - name: Validate synchronized version
        run: |
          test "$(cat VERSION)" = "2.8.1"
          grep -q "2.8.1" version.js
          grep -q "v2.8.1" index.html
          grep -q "?v=2.8.1" index.html
          grep -q "### 2.8.1" README.md
      - name: Commit patched Chrona
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js VERSION version.js index.html README.md
          git commit -m "Chrona 2.8.1: refine sticky axis lanes overflow radar"
          git push origin dev
