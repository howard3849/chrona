name: Run Chrona 2.8.8 patch

on:
  push:
    branches: [dev]
    paths:
      - 'tools/patch_chrona_2_8_8.py'
      - '.github/workflows/run-patch-chrona-2-8-8.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/patch_chrona_2_8_8.py
      - name: Validate JavaScript
        run: node --check timeline.js
      - name: Validate synchronized version
        run: |
          test "$(cat VERSION)" = "2.8.8"
          grep -q "2.8.8" version.js
          grep -q "v2.8.8" index.html
          grep -q "?v=2.8.8" index.html
          grep -q "### 2.8.8" README.md
          grep -q "laneKeepingToggle" timeline.js
          grep -q "eventAnchorSideSuppressed" timeline.js
          grep -q "unlimited = false" timeline.js
          grep -q "#timelineCanvas { z-index: 1; }" styles.css
      - name: Commit patched Chrona
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js styles.css index.html VERSION version.js README.md
          git commit -m "Chrona 2.8.8: add mixed layout toggle and unify anchor rendering"
          git push origin dev
