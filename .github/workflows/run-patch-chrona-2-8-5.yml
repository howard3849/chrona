name: Run Chrona 2.8.5 patch

on:
  push:
    branches: [dev]
    paths:
      - 'tools/patch_chrona_2_8_5.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/patch_chrona_2_8_5.py
      - name: Validate JavaScript
        run: node --check timeline.js
      - name: Validate synchronized version
        run: |
          test "$(cat VERSION)" = "2.8.5"
          grep -q "2.8.5" version.js
          grep -q "v2.8.5" index.html
          grep -q "?v=2.8.5" index.html
          grep -q "### 2.8.5" README.md
          grep -q "ArrowUp" timeline.js
          grep -q "worldToRadarY" timeline.js
      - name: Commit patched Chrona
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js index.html VERSION version.js README.md
          git commit -m "Chrona 2.8.5: keyboard pan and sync radar world geometry"
          git push origin dev
