name: Run Chrona 2.8.7 patch

on:
  push:
    branches: [dev]
    paths:
      - 'tools/patch_chrona_2_8_7.py'
      - '.github/workflows/run-patch-chrona-2-8-7.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/patch_chrona_2_8_7.py
      - name: Validate JavaScript
        run: node --check timeline.js
      - name: Validate synchronized version
        run: |
          test "$(cat VERSION)" = "2.8.7"
          grep -q "2.8.7" version.js
          grep -q "v2.8.7" index.html
          grep -q "?v=2.8.7" index.html
          grep -q "### 2.8.7" README.md
          grep -q "candidateSpans = \[250, 500, 1000\]" timeline.js
          grep -q "soleSide" timeline.js
          grep -q "is-repeated-year" timeline.js
          grep -q "stickyTop" timeline.js
      - name: Commit patched Chrona
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js styles.css index.html VERSION version.js README.md
          git commit -m "Chrona 2.8.7: refine home lanes zoom list and connectors"
          git push origin dev
