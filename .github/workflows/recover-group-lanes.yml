name: Recover Chrona group lanes

on:
  push:
    branches: [dev]
    paths:
      - 'tools/recover_group_lanes.py'
      - '.github/workflows/recover-group-lanes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply recovery migration
        run: python tools/recover_group_lanes.py
      - name: Validate JavaScript
        run: node --check timeline.js
      - name: Validate synchronized version
        run: |
          test "$(cat VERSION)" = "2.8.0"
          grep -q "window.CHRONA_VERSION = '2.8.0'" version.js
          grep -q 'id="appVersion">v2.8.0<' index.html
          ! grep -q '?v=2.7.0' index.html
      - name: Commit recovered lanes
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js VERSION version.js index.html README.md
          git commit -m "Restore fixed group lanes with v2.7 enhancements"
          git push origin HEAD:dev
