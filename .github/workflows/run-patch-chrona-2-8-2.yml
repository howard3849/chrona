name: Run Chrona 2.8.2 patch

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/run_patch_chrona_2_8_2.py
      - name: Validate JavaScript
        run: node --check timeline.js
      - name: Validate synchronized version
        run: |
          test "$(cat VERSION)" = "2.8.2"
          grep -q "2.8.2" version.js
          grep -q "v2.8.2" index.html
          grep -q "?v=2.8.2" index.html
          grep -q "### 2.8.2" README.md
          grep -q "axisCanvas" index.html
          grep -q "axis-canvas" styles.css
      - name: Commit patched Chrona
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js styles.css index.html VERSION version.js README.md
          git commit -m "Chrona 2.8.2: foreground axis animated clusters radar geometry"
          git push origin dev
