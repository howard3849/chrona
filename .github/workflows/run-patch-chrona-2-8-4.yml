name: Run Chrona 2.8.4 patch

on:
  push:
    branches: [dev]
    paths:
      - 'tools/patch_chrona_2_8_4.py'
      - '.github/workflows/run-patch-chrona-2-8-4.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/patch_chrona_2_8_4.py
      - name: Validate JavaScript
        run: node --check timeline.js
      - name: Validate synchronized version
        run: |
          test "$(cat VERSION)" = "2.8.4"
          grep -q "2.8.4" version.js
          grep -q "v2.8.4" index.html
          grep -q "?v=2.8.4" index.html
          grep -q "### 2.8.4" README.md
          grep -q "singleGroupNaturalHeight" timeline.js
          grep -q "pan2d" timeline.js
          grep -q "cursor-label-gap" css/year-ruler.css
      - name: Commit patched Chrona
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline.js styles.css css/year-ruler.css index.html VERSION version.js README.md
          git commit -m "Chrona 2.8.4: expand single lanes and enable 2D radar"
          git push origin dev
